name = "hrm-tien-huy-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "hrm-tien-huy-db"
database_id = "8231e20c-8a17-482d-90a9-ae5de9ff9bdc"

# R2 — kho lưu tệp đính kèm / ảnh. YÊU CẦU trước khi deploy Worker:
#   1) Bật R2 trong Cloudflare Dashboard (Storage & Databases → R2 → Enable)
#   2) Tạo bucket:  wrangler r2 bucket create hrm-tien-huy-files
# Nếu chưa tạo bucket mà deploy, wrangler sẽ báo lỗi binding.
# Handler đã guard: nếu binding vắng mặt, route /api/files trả 503 thân thiện.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hrm-tien-huy-files"

# JWT_SECRET được đặt qua `wrangler secret put JWT_SECRET` (không lưu trong repo).
[vars]
CORS_ORIGIN = "*"
