name = "hrm-tien-huy-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "hrm-tien-huy-db"
database_id = "8231e20c-8a17-482d-90a9-ae5de9ff9bdc"

# R2 tạm tắt: tài khoản chưa bật R2 (cần enable trong Cloudflare Dashboard).
# Chỉ dùng cho upload tệp đính kèm — không ảnh hưởng các chức năng khác.
# Bật lại khi đã enable R2:
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "hrm-tien-huy-files"

# JWT_SECRET được đặt qua `wrangler secret put JWT_SECRET` (không lưu trong repo).
[vars]
CORS_ORIGIN = "*"
