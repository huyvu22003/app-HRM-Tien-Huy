name: Deploy Frontend (Pages)

# Tự động build frontend (Next static export) và deploy lên Cloudflare Pages
# mỗi khi có thay đổi trên nhánh main. Trước đây production không tự cập nhật
# vì Pages Git-integration chỉ tạo bản preview cho PR, không deploy production.
# Có thể chạy tay bằng nút "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài dependencies
        run: npm ci

      - name: Build static site (đọc .env.production -> NEXT_PUBLIC_API_URL)
        run: npm run build

      - name: Deploy lên Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=hrm-tien-huy --branch=main
